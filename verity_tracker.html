<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verity + KnowLine · Shared tracker</title>
  <style>
    :root{font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;color:#edf2fa;background:#0d1420}
    *{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2a394d;padding:22px max(24px,calc((100vw - 1360px)/2));font-size:24px;font-weight:700}
    main{max-width:1408px;margin:auto;padding:36px 24px}h1{font-size:32px;font-weight:600;margin:0 0 8px}p{color:#a7b5ca;margin:0 0 22px}
    nav{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:26px}a{color:#acc9ff}label{display:block;margin-bottom:8px;color:#a7b5ca}
    input{width:100%;max-width:600px;padding:12px 14px;background:#101925;border:1px solid #2a394d;border-radius:8px;color:#edf2fa;font:inherit}
    button{padding:10px 14px;background:#acc9ff;color:#0d1420;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#c6d9ff}
    .model-tabs{display:flex;gap:8px;margin:0 0 22px}.model-tabs button[aria-selected="false"]{background:#1b2a3d;color:#edf2fa;border:1px solid #2a394d}
    input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #91b8ff;outline-offset:3px}
    .meta{margin:14px 0;color:#a7b5ca}.table-wrap{overflow:auto;border:1px solid #2a394d;border-radius:12px}
    table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px;border-bottom:1px solid #2a394d;vertical-align:top;font-size:13px}
    th{background:#1b2a3d;position:sticky;top:0;white-space:nowrap}tr:last-child td{border-bottom:0}tr:hover td{background:#172436}
    td:nth-child(5){min-width:240px;max-width:480px;overflow-wrap:anywhere}td:nth-child(1){white-space:nowrap}
    .prompt-preview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:pre-wrap;line-height:1.45}
    .prompt-details summary{white-space:normal;list-style:none}.prompt-details summary::-webkit-details-marker{display:none}
    .prompt-details[open] .prompt-preview{display:none}.expand-label{display:block;margin-top:7px;color:#acc9ff;font-weight:600}
    .prompt-details[open] .expand-label{display:none}.prompt-full{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin-top:8px}
    summary{cursor:pointer;color:#acc9ff;white-space:nowrap}dl{display:grid;grid-template-columns:minmax(125px,180px) minmax(220px,1fr);gap:8px 14px;min-width:420px;margin:15px 0 0}
    dt{color:#a7b5ca}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}details{max-width:700px}
    @media(max-width:1100px){th:nth-child(2),td:nth-child(2),th:nth-child(4),td:nth-child(4){display:none}}
    @media(max-width:700px){main{padding:26px 14px}header{padding:20px 14px}h1{font-size:26px}th:nth-child(3),td:nth-child(3),th:nth-child(6),td:nth-child(6){display:none}td:nth-child(5){min-width:180px}}
  </style>
</head>
<body>
  <header>Model tracker</header>
  <main>
    <h1>Shared tracker</h1>
    <p>Separate model views. KnowLine details include intent names, descriptions, Do/Don’t, scores, and line decisions. Newest first.</p>
    <nav><a href="/">Back to model tester</a><a href="/tracking.xlsx" download>Download workbook · both sheets</a><a href="/tracking.csv" download>Verity CSV</a><a href="/knowline/tracking.csv" download>KnowLine CSV</a><button type="button" id="refresh">Refresh now</button></nav>
    <div class="model-tabs" role="tablist" aria-label="Tracker model"><button type="button" id="verityTab" role="tab" aria-selected="true">Fine-tuned Verity (<!--VERITY_COUNT-->)</button><button type="button" id="knowlineTab" role="tab" aria-selected="false">KnowLine 4B (<!--KNOWLINE_COUNT-->)</button></div>
    <label for="search">Search all fields</label>
    <input id="search" type="search" placeholder="Prompt, entity, intent, category…" autocomplete="off">
    <div class="meta" id="count"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Time (UTC)</th><th>Model</th><th>Mode</th><th>Category</th><th>Prompt</th><th>Predicted intents</th><th>Details</th></tr></thead>
      <tbody id="rows"><!--TRACKER_ROWS--></tbody>
    </table></div>
  </main>
  <script>
    const search=document.getElementById('search'), rows=[...document.querySelectorAll('#rows tr')], count=document.getElementById('count');
    const tabs={verity:document.getElementById('verityTab'),knowline:document.getElementById('knowlineTab')};
    let active=location.hash==='#knowline'?'knowline':'verity';
    document.getElementById('refresh').addEventListener('click',()=>location.reload());
    function filterRows(){const query=search.value.trim().toLocaleLowerCase();let shown=0,total=0;for(const row of rows){if(row.dataset.model===active)total++;const match=row.dataset.model===active&&(!query||row.textContent.toLocaleLowerCase().includes(query));row.hidden=!match;if(match)shown++;}count.textContent=`${shown} of ${total} ${active==='knowline'?'KnowLine':'Verity'} rows`;for(const [name,tab] of Object.entries(tabs))tab.setAttribute('aria-selected',String(name===active));}
    for(const [name,tab] of Object.entries(tabs))tab.addEventListener('click',()=>{active=name;location.hash=name;search.value='';filterRows();});
    search.addEventListener('input',filterRows);
    filterRows();
    setInterval(()=>location.reload(),10000);
  </script>
</body>
</html>
